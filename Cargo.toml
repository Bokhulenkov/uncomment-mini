[package]
name = "uncomment"
version = "0.1.0"
description = "Remove comments from h, m, mm and swift files with fixed built-in rules"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
ignore = "0.4.33"
tree-sitter = "0.26.13"
tree-sitter-c = { path = "grammars/tree-sitter-c" }
tree-sitter-cpp = { path = "grammars/tree-sitter-cpp" }
tree-sitter-objc = { path = "grammars/tree-sitter-objc" }
tree-sitter-swift = { path = "grammars/tree-sitter-swift" }
