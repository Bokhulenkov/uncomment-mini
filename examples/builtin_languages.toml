# Overrides for the four supported source languages.
[global]
remove_todos = false
remove_fixme = false
remove_docs = false

[languages.c]
preserve_patterns = ["NOLINT", "clang-format"]

[languages.cpp]
preserve_patterns = ["NOLINT", "clang-format"]

[languages.objc]
preserve_patterns = ["MARK:"]

[languages.swift]
preserve_patterns = ["MARK:", "swiftlint:"]
