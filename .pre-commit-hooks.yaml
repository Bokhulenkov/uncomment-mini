- id: uncomment
  name: Uncomment
  description: Remove comments from source code files while preserving linting directives
  entry: uncomment
  language: rust
  types_or: [text]
  files: (?i)\.(c|h|cpp|cxx|cc|c\+\+|hpp|hxx|hh|h\+\+|m|swift)$
  require_serial: true
  pass_filenames: true
  minimum_pre_commit_version: "2.9.0"
  args: ["--no-gitignore"]
